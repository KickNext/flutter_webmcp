name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool example/lib

      - name: Analyze package
        run: flutter analyze

      - name: Run VM and widget tests
        run: flutter test

      - name: Run browser tests
        run: dart test -p chrome test/webmcp_browser_test.dart

      - name: Install Chrome with native WebMCP lifecycle events
        run: |
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/chrome-for-testing-public/157.0.8079.0/linux64/chrome-linux64.zip \
            --output "$RUNNER_TEMP/webmcp-chrome.zip"
          unzip -q "$RUNNER_TEMP/webmcp-chrome.zip" -d "$RUNNER_TEMP/webmcp-chrome"
          echo "CHROME_EXECUTABLE=$RUNNER_TEMP/webmcp-chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"
          # Ubuntu restricts user namespaces for downloaded Chrome binaries.
          # Use the installed Chrome sandbox helper as Chromium recommends.
          test -x /opt/google/chrome/chrome-sandbox
          sudo chown root:root /opt/google/chrome/chrome-sandbox
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          echo "CHROME_DEVEL_SANDBOX=/opt/google/chrome/chrome-sandbox" >> "$GITHUB_ENV"

      - name: Check native lifecycle and HTTP Permissions Policy
        run: dart run tool/check_native_browser.dart

      - name: Analyze example
        run: flutter analyze example

      - name: Build JavaScript example
        working-directory: example
        run: flutter build web --release

      - name: Build WebAssembly example
        working-directory: example
        run: flutter build web --wasm --release

      - name: Install pana
        run: dart pub global activate pana 0.23.18

      - name: Check pub.dev score
        run: dart pub global run pana . --exit-code-threshold 0

      - name: Validate publish archive
        run: flutter pub publish --dry-run
