name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Analyze package
        run: flutter analyze

      - name: Run VM and widget tests
        run: flutter test

      - name: Run browser tests
        run: dart test -p chrome test/webmcp_browser_test.dart

      - name: Analyze example
        run: flutter analyze example

      - name: Build JavaScript example
        working-directory: example
        run: flutter build web --release

      - name: Build WebAssembly example
        working-directory: example
        run: flutter build web --wasm --release

      - name: Validate publish archive
        run: flutter pub publish --dry-run
