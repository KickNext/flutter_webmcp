version: 2

updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # lints 6.x requires Dart 3.8, while the package supports Dart 3.6.
      - dependency-name: lints
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
